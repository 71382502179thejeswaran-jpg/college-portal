version: '3.8'

# ====================================================================
# Containerizing a College Portal - Multi-Tier Orchestration
# IBM Academic Project Submission
# Services:
#   1. database  (PostgreSQL 16 Engine with volume persistence)
#   2. backend   (Node.js / Express REST API with Healthcheck)
#   3. frontend  (Nginx Web Server & Reverse Proxy)
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. DATABASE SERVICE (PostgreSQL)
  # ------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: college_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-college_portal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - college-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-college_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # 2. BACKEND API SERVICE (Node.js / Express)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_portal_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-college_portal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_ibm_portal_key_2026}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - college-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------------
  # 3. FRONTEND SERVICE (Nginx Web Server & Proxy)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_portal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - college-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# --------------------------------------------------------------------
# VOLUMES & NETWORKS
# --------------------------------------------------------------------
volumes:
  db_data:
    driver: local
    name: college_portal_pgdata

networks:
  college-net:
    driver: bridge
    name: college_portal_network
